
spring.application.name=gerador-nota-fiscal
spring.profiles.default=local
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.flyway.enabled=true
logging.level.br.com.itau.geradornotafiscal=${LOG_LEVEL_APP:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [correlationId=%X{correlationId:-none} flowId=%X{flowId:-none}] [%thread] %logger{36} - %msg%n
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
app.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:1s}
app.outbox.lock-duration=${OUTBOX_LOCK_DURATION:30s}
app.outbox.base-delay=${OUTBOX_BASE_DELAY:1s}
app.outbox.max-backoff=${OUTBOX_MAX_BACKOFF:5m}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
