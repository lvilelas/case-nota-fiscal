
spring.application.name=gerador-nota-fiscal
spring.profiles.default=local
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.flyway.enabled=true
logging.level.br.com.itau.geradornotafiscal=${LOG_LEVEL_APP:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [traceId=%X{traceId:-none} spanId=%X{spanId:-none} correlationId=%X{correlationId:-none} flowId=%X{flowId:-none}] [%thread] %logger{36} - %msg%n
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.discovery.enabled=false
management.server.port=${MANAGEMENT_PORT:8080}
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.50,0.90,0.95,0.99
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.opentelemetry.resource-attributes[service.name]=${spring.application.name}
management.opentelemetry.resource-attributes[deployment.environment]=${SPRING_PROFILES_ACTIVE:local}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.timeout=${OTEL_EXPORT_TIMEOUT:5s}
management.otlp.metrics.export.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
app.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:1s}
app.outbox.lock-duration=${OUTBOX_LOCK_DURATION:30s}
app.outbox.base-delay=${OUTBOX_BASE_DELAY:1s}
app.outbox.max-backoff=${OUTBOX_MAX_BACKOFF:5m}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
