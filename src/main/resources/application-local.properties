app.aws.region=${AWS_REGION:us-east-1}
app.aws.endpoint=${AWS_ENDPOINT_URL:http://localhost:4566}
app.aws.access-key=${AWS_ACCESS_KEY_ID:test}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:test}
app.aws.sns.topic-arn=${AWS_SNS_NOTA_FISCAL_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:nota-fiscal-gerada}
app.aws.retry.max-attempts=${AWS_MAX_ATTEMPTS:4}
app.aws.retry.base-delay=${AWS_RETRY_BASE_DELAY:200ms}
app.aws.retry.max-backoff=${AWS_RETRY_MAX_BACKOFF:5s}
app.aws.secrets.application-secret-name=${AWS_APPLICATION_SECRET_NAME:case-nota-fiscal/local}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nota_fiscal}
spring.datasource.username=${DB_USERNAME:nota_fiscal_app}
spring.datasource.password=${DB_PASSWORD:local-only}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
