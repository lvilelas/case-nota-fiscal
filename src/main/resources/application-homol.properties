app.aws.region=${AWS_REGION:us-east-1}
app.aws.endpoint=${AWS_ENDPOINT_URL:}
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.sns.topic-arn=${AWS_SNS_NOTA_FISCAL_TOPIC_ARN}
app.aws.retry.max-attempts=${AWS_MAX_ATTEMPTS:4}
app.aws.retry.base-delay=${AWS_RETRY_BASE_DELAY:200ms}
app.aws.retry.max-backoff=${AWS_RETRY_MAX_BACKOFF:5s}
app.aws.secrets.application-secret-name=${AWS_APPLICATION_SECRET_NAME:case-nota-fiscal/homol}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
