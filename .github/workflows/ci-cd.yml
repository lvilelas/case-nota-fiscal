name: CI educacional

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, testes e segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo para secret scanning
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testes e gate JaCoCo
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Testes dos consumidores simulados
        run: ./mvnw -f consumidores-simulados/pom.xml --batch-mode --no-transfer-progress verify

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: |
            target/site/jacoco
            consumidores-simulados/target/site/jacoco
          if-no-files-found: warn

      - name: Secret scanning com Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0
          git /repo --verbose

      - name: Vulnerabilidades e configurações inseguras
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.73.0

  image:
    name: Build e scan das imagens (sem publicacao)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagem local
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: case-nota-fiscal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagem dos consumidores
        uses: docker/build-push-action@v7
        with:
          context: .
          file: consumidores-simulados/Dockerfile
          load: true
          push: false
          tags: case-nota-fiscal-consumidores:${{ github.sha }}
          cache-from: type=gha,scope=consumidores
          cache-to: type=gha,mode=max,scope=consumidores

      - name: Analisar imagem
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: case-nota-fiscal:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.73.0

      - name: Analisar imagem dos consumidores
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: case-nota-fiscal-consumidores:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.73.0
