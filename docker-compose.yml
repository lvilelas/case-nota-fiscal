services:
  postgres:
    image: postgres:16-alpine
    container_name: case-nota-fiscal-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nota_fiscal
      POSTGRES_USER: nota_fiscal_app
      POSTGRES_PASSWORD: local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nota_fiscal_app -d nota_fiscal"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.14.0
    container_name: case-nota-fiscal-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs,secretsmanager
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 30s
      start_interval: 2s
      start_period: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
