spring.application.name=consumidores-simulados
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false
server.port=${CONSUMER_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

app.consumer.type=${CONSUMER_TYPE:ALL}
app.consumer.queue-prefix=${SQS_QUEUE_PREFIX:nota-fiscal-}
app.consumer.wait-time-seconds=${SQS_WAIT_TIME_SECONDS:20}
app.consumer.visibility-timeout-seconds=${SQS_VISIBILITY_TIMEOUT_SECONDS:30}
app.consumer.max-messages=${SQS_MAX_MESSAGES:1}
app.consumer.error-backoff=${SQS_ERROR_BACKOFF:1s}

app.aws.region=${AWS_REGION:us-east-1}
app.aws.endpoint=${AWS_ENDPOINT_URL:}
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.metrics.tags.application=${spring.application.name}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [correlationId=%X{correlationId:-none} flowId=%X{flowId:-none} eventId=%X{eventId:-none}] [%thread] %logger{36} - %msg%n
